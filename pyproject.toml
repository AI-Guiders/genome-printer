[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genome-printer"
version = "2.0.0"
description = "Parameter-free cellular-automaton genome interpreter and O(1) protein folder on the cuboctahedral FCC N12 lattice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../mt-lattice-fluid", "vendor/mt-lattice-fluid"]
